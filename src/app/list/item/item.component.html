<div class="item-dialog-header">
  <h2 mat-dialog-title class="item-title">
    @if (item.url) {
      <a
        href="{{ item.affiliateUrl || item.url }}"
        target="_blank"
        rel="noopener noreferrer"
        class="item-link"
      >
        {{ item.name }}
        <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
      </a>
    } @else {
      <span>{{ item.name }}</span>
    }
  </h2>
  <button
    type="button"
    mat-dialog-close
    class="close-icon-btn"
    aria-label="Close"
  >
    <i class="fa-solid fa-xmark"></i>
  </button>
</div>

@if (item.details) {
  <mat-dialog-content class="item-content">
    <p class="item-details">{{ item.details }}</p>
  </mat-dialog-content>
}

<mat-dialog-actions class="item-actions">
  @if ((!isGeneralList && spoilers) || (isGeneralList && isOwner)) {
    <button
      mat-flat-button
      color="primary"
      class="primary-action-btn"
      (click)="togglePurchase()"
    >
      <i
        class="fa-solid"
        [class.fa-check]="!item.purchased"
        [class.fa-rotate-left]="item.purchased"
      ></i>
      @if (!isGeneralList && spoilers) {
        {{ item.purchased ? "Mark as Not Purchased" : "Mark as Purchased" }}
      } @else {
        {{ item.purchased ? "Uncheck Item" : "Check Off Item" }}
      }
    </button>
  }

  <div class="secondary-actions">
    @if (isOwner) {
      <button
        mat-stroked-button
        color="primary"
        class="secondary-action-btn icon-collapse-btn"
        aria-label="Edit"
        (click)="onEditItem()"
      >
        <i class="fa-solid fa-pen"></i>
        <span class="btn-label">Edit</span>
      </button>
    }
    @if (item.camelUrl) {
      <a
        mat-stroked-button
        color="accent"
        class="secondary-action-btn"
        href="{{ item.camelUrl }}"
        target="_blank"
        rel="noopener noreferrer"
      >
        <i class="fa-solid fa-chart-line"></i>
        Track Price
      </a>
    }
    <button
      mat-stroked-button
      color="accent"
      class="secondary-action-btn icon-collapse-btn"
      aria-label="Copy To List"
      (click)="openCopyToListModal()"
    >
      <i class="fa-solid fa-copy"></i>
      <span class="btn-label">Copy To List</span>
    </button>
  </div>
</mat-dialog-actions>
